[pytest]
# Pytest configuration for llasa-trainer

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to Python path
pythonpath = .

# Show extra test summary info
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests that don't require external models
    integration: Integration tests that may require models
    slow: Tests that take significant time to run

# Ignore certain directories
testpaths = tests

# Minimum Python version
minversion = 3.8
